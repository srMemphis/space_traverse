General:
    outdir: "out/sphere_mask"
    iterations: 2
    deltaTime: 1e-5
    saveInterval: 100
Mesh:
    filename: "msh/sphere_mask.msh"
    Target:
        name: "Target"
        material: "Glass"
        boundary: "Target Boundary"
    World:
        name: "World"
        material: "Air"
        boundary: "World Boundary"
    Mask:
        name: "Mask"
        material: "Metall"
        boundary: "Mask Boundary"
Beam:
    current: -100e-9        # A
    energy: 10e3            # eV
    radius: 0.0005          # d =  1 mm
    divergence: 0.25        # degrees
    numtracks: 0            # 3 * n^2 tracks
    numsteps: 40000         # verlet steps
    Pos:
        x: 0
        y: 0
        z: 0
    Stare:
        x: 0
        y: 0
        z: 0.002
Solver:
    smooth: false
    Materials:
        Air:
            epsilon: 1
        Glass: 
            epsilon: 2
        Metall: 
            epsilon: 1000
